<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FDE047" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="crestBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#F59E0B" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Royal Apparel & Loom Crest Emblem -->
  <g transform="translate(10, 10)">
    <!-- Base Shield with Gold Border -->
    <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#crestBg)" stroke="url(#goldShine)" stroke-width="2.5" filter="url(#glow)" />
    
    <!-- Stylized Royal Sherwani / Tuxedo Collar & Neckline -->
    <path d="M50 22 L32 46 L42 46 L50 35 L58 46 L68 46 Z" fill="url(#goldShine)" />
    <!-- V-Shape Lapels -->
    <path d="M35 48 L50 78 L65 48" fill="none" stroke="url(#goldShine)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Center Button Accents -->
    <circle cx="50" cy="52" r="2.5" fill="#FFFFFF" />
    <circle cx="50" cy="62" r="2.5" fill="url(#goldShine)" />
    <circle cx="50" cy="72" r="2.5" fill="url(#goldShine)" />
    
    <!-- Weaving Needle & Thread Sparkle -->
    <path d="M68 28 L72 32 L69 35 L65 31 Z" fill="#FFFFFF" />
    <circle cx="70" cy="30" r="1.5" fill="#1E1B4B" />
  </g>

  <!-- VastraSync Typography -->
  <g transform="translate(125, 20)">
    <!-- Main Brand Name -->
    <text x="0" y="44" font-family="'Plus Jakarta Sans', 'Cinzel', 'Montserrat', sans-serif" font-size="36" font-weight="800" fill="#FFFFFF" letter-spacing="2">
      VASTRA<tspan fill="url(#goldShine)" font-weight="900">SYNC</tspan>
    </text>
    
    <!-- Subtitle / Tagline -->
    <text x="2" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="3.5">
      ETHNIC WEAR ERP &amp; POS RETAIL
    </text>

    <!-- Luxury Gold Accent Rule -->
    <line x1="2" y1="80" x2="360" y2="80" stroke="url(#goldShine)" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />
    <circle cx="366" cy="80" r="2.5" fill="url(#goldShine)" />
  </g>
</svg>
