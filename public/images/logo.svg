<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6D365" />
      <stop offset="50%" stop-color="#FDA085" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4F46E5" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Studio Emblem Icon -->
  <g transform="translate(10, 10)">
    <!-- Base Glow Circle -->
    <circle cx="50" cy="50" r="48" fill="#1E1B4B" filter="url(#shadow)" />
    <circle cx="50" cy="50" r="46" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
    
    <!-- Camera Body Silhouette -->
    <rect x="26" y="34" width="48" height="34" rx="7" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
    <path d="M40 34 L43 28 L57 28 L60 34 Z" fill="url(#goldGrad)" />
    
    <!-- Lens / Interlocking Wedding Rings Motif -->
    <circle cx="50" cy="51" r="14" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9" />
    <circle cx="50" cy="51" r="9" fill="url(#goldGrad)" opacity="0.3" />
    
    <!-- Sparkling Diamond Aperture -->
    <polygon points="50,44 54,51 50,58 46,51" fill="url(#goldGrad)" />
    
    <!-- Flash sparkle -->
    <circle cx="66" cy="39" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <g transform="translate(125, 20)">
    <text x="0" y="42" font-family="'Cinzel', 'Playfair Display', 'Segoe UI', serif" font-size="34" font-weight="700" fill="#1E1B4B" letter-spacing="2">
      WEDDING<tspan fill="url(#goldGrad)"> STUDIO</tspan>
    </text>
    <text x="2" y="68" font-family="'Inter', 'Segoe UI', -apple-system, sans-serif" font-size="13" font-weight="600" fill="#64748B" letter-spacing="4">
      BILLING &amp; POS MANAGEMENT
    </text>
  </g>
</svg>
