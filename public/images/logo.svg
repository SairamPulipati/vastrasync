<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FDE047" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="crestBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#F59E0B" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Studio Crest Emblem -->
  <g transform="translate(10, 10)">
    <!-- Base Shield/Circle with Gold Border -->
    <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#crestBg)" stroke="url(#goldShine)" stroke-width="2.5" filter="url(#glow)" />
    
    <!-- Camera Body -->
    <rect x="26" y="36" width="48" height="34" rx="8" fill="none" stroke="url(#goldShine)" stroke-width="2.5" />
    <path d="M40 36 L43 29 L57 29 L60 36 Z" fill="url(#goldShine)" />
    
    <!-- Interlocking Wedding Rings / Shutter Center -->
    <circle cx="45" cy="53" r="11" fill="none" stroke="#FFFFFF" stroke-width="2.2" opacity="0.95" />
    <circle cx="55" cy="53" r="11" fill="none" stroke="url(#goldShine)" stroke-width="2.2" />
    <circle cx="50" cy="53" r="3.5" fill="url(#goldShine)" />
    
    <!-- Camera Flash Sparkle -->
    <path d="M66 38 L68 41 L71 41 L69 43 L70 46 L67 44 L64 46 L65 43 L63 41 L66 41 Z" fill="#FFFFFF" />
  </g>

  <!-- Studio Typography -->
  <g transform="translate(125, 20)">
    <!-- Main Studio Name -->
    <text x="0" y="44" font-family="'Plus Jakarta Sans', 'Cinzel', 'Montserrat', sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="2">
      WEDDING<tspan fill="url(#goldShine)" font-weight="900"> STUDIO</tspan>
    </text>
    
    <!-- Tagline / Accent -->
    <text x="2" y="70" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="12" font-weight="700" fill="#CBD5E1" letter-spacing="4.5">
      LUXURY PHOTOGRAPHY &amp; POS
    </text>

    <!-- Subtle Gold Divider Line -->
    <rect x="2" y="80" width="320" height="2" rx="1" fill="url(#goldShine)" opacity="0.8" />
  </g>
</svg>
